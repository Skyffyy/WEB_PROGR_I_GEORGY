<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list | Georgy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>To-do list</h1>
        <p><a href="../index.html">← Back to home</a></p>
    </header>

    <main>
        <div class="input-row">
            <input type="text" id="new-task" placeholder="New task...">
            <button id="add-button">Add</button>
        </div>
        <p id="message"></p>

        <p class="count">Tasks: <span id="count">0</span></p>
        <ul id="task-list"></ul>

        <button id="delete-done">Delete done</button>
    </main>

    <footer>
        <p>© 2026 Georgy</p>
    </footer>

    <!--
        Why is the script at the end of body?
        The browser reads HTML from top to bottom. If the script were in head,
        it would run before input, button and ul exist,
        and getElementById would return null. At the end of body all elements are already on the page.
    -->
    <script src="script.js"></script>
</body>
</html>
